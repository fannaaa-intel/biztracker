<!DOCTYPE html>
<!-- Shared page for every printable document. ReportService replaces each {{key}} (values are HTML-encoded). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{title}} {{reference_no}}</title>
<style>
  @page { size: {{page_size}}; margin: 14mm; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e8f2f8; font-family: "Segoe UI", Arial, sans-serif; color: #1f2937; }
  .toolbar { max-width: 760px; margin: 18px auto 0; padding: 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .toolbar span { color: #4b5563; font-size: 13px; }
  .toolbar button { white-space: nowrap; flex-shrink: 0; background: #0B6E99; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .sheet { max-width: {{sheet_width}}; margin: 12px auto 30px; background: #fff; border-radius: 10px; padding: {{sheet_padding}};
           box-shadow: 0 4px 18px rgba(11, 110, 153, .15); position: relative; overflow: hidden; }
  .sheet::before { content: ""; position: absolute; inset: 0; border: 6px double #0B6E99; border-radius: 10px; pointer-events: none; opacity: .55; }
  .lgu { text-align: center; line-height: 1.35; }
  .seal { width: 64px; height: 64px; border-radius: 50%; background: #0B6E99; color: #fff; font-weight: 700; font-size: 20px;
          display: inline-flex; align-items: center; justify-content: center; margin-bottom: 6px; }
  .lgu .small { font-size: 12px; color: #4b5563; letter-spacing: .5px; }
  .lgu .name { font-size: 17px; font-weight: 700; color: #0B6E99; text-transform: uppercase; }
  .lgu .office { font-size: 13px; font-weight: 600; margin-top: 2px; }
  h1 { text-align: center; font-size: 26px; letter-spacing: 1px; margin: 18px 0 4px; text-transform: uppercase; }
  .refline { text-align: center; font-size: 14px; color: #4b5563; margin-bottom: 18px; }
  .refline b { color: #1f2937; }
  table.info { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0 14px; }
  table.info td { padding: 6px 8px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
  table.info td.k { width: 34%; color: #6b7280; }
  table.grid { width: 100%; border-collapse: collapse; font-size: 13px; margin: 6px 0 14px; }
  table.grid th { background: #e1f1f8; color: #0B6E99; text-align: left; padding: 7px 8px; font-size: 12px; text-transform: uppercase; }
  table.grid td { padding: 7px 8px; border-bottom: 1px solid #e5e7eb; }
  table.grid td.num, table.grid th.num { text-align: right; }
  .total { text-align: right; font-size: 16px; font-weight: 700; margin: 4px 0 16px; }
  .statement { font-size: 14px; line-height: 1.6; margin: 10px 0 16px; text-align: justify; }
  .sign { display: flex; justify-content: flex-end; margin-top: 34px; }
  .sign div { text-align: center; min-width: 240px; border-top: 1px solid #1f2937; padding-top: 4px; font-size: 13px; }
  .verify { margin-top: 26px; padding: 10px 12px; background: #f3f7fa; border-radius: 8px; font-size: 12px; color: #4b5563;
            display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .verify b { color: #1f2937; letter-spacing: 1px; }
  .stamp { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; background: #dcfce7; color: #16a34a; }
  .stamp.warn { background: #fef3c7; color: #d97706; }
  /* Health certificate card (CR80 size) */
  .card { width: 3.375in; height: 2.125in; margin: 0 auto; border: 1px solid #0B6E99; border-radius: 10px; padding: 8px 10px; font-size: 9px; position: relative; }
  .card .top { display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; }
  .card .seal { width: 30px; height: 30px; font-size: 10px; margin: 0; }
  .card .lguname { font-weight: 700; color: #0B6E99; font-size: 9px; text-transform: uppercase; }
  .card h2 { font-size: 12px; margin: 5px 0 3px; text-transform: uppercase; color: #0B6E99; }
  .card .who { font-size: 13px; font-weight: 700; }
  .card table { width: 100%; font-size: 8.5px; border-collapse: collapse; margin-top: 3px; }
  .card td { padding: 1px 0; }
  .card .foot { position: absolute; bottom: 6px; left: 10px; right: 10px; font-size: 7.5px; color: #4b5563; display: flex; justify-content: space-between; }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .sheet { box-shadow: none; margin: 0 auto; max-width: none; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <span>{{title}} · {{reference_no}} — use “Print” and choose “Save as PDF” to keep a digital copy.</span>
    <button onclick="window.print()">Print / Save as PDF</button>
  </div>
  <div class="sheet">
{{body}}
  </div>
</body>
</html>
